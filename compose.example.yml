services:
  twitter-x-backup-cli:
    image: ${DOCKER_REGISTRY:-registry.example.com:5000}/twitter-x-backup-cli:latest
    container_name: twitter-x-backup-cli
    environment:
      BACKUP__CONFIG__DIRECTORY: /app/config
      BACKUP__Aliases__L: /mnt/data
      TZ: ${TZ:-UTC}
    volumes:
      - "./Config:/app/config:ro"
      - "./data:/app/data"
      - "./debug:/app/debug"

  twitter-x-backup-api:
    image: ${DOCKER_REGISTRY:-registry.example.com:5000}/twitter-x-backup-api:latest
    container_name: twitter-x-backup-api
    environment:
      BACKUP__CONFIG__DIRECTORY: /app/config
      BACKUP__Aliases__L: /mnt/data
      TZ: ${TZ:-UTC}
    ports:
      - "${API_PORT:-8081}:8081"
    volumes:
      - "./Config:/app/config:ro"
      - "./data:/app/data"
      - "./debug:/app/debug"
